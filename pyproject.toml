[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-rescue-rag"
version = "0.1.0"
description = "A reproducible prototype for cost-aware graph rescue after hybrid retrieval."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
authors = [
    {name = "Maksim Odintsov", email = "maksim.odintcov@math.msu.ru"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "retrieval-augmented generation",
    "graph retrieval",
    "multi-hop question answering",
    "information retrieval",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
graph-rescue = "graph_rescue.cli:main"

[tool.setuptools.packages.find]
include = ["graph_rescue*"]
